name: Build

# Windows and Linux builds, packaged for players and servers (tools/package.py). Pushes to main
# replace the rolling "latest" prerelease; pushing a v* tag (v + steam.inf's PatchVersion) makes a
# release with its packages and the changelog since the previous tag (tools/changelog.py).
# After Neotokyo: Rebuild's cibuild.yml, on the SDK's VPC build instead of CMake.

# Pushes and pull requests only build when something that goes into the build changed: the code, the
# mod folder, or the build and packaging scripts and this workflow. Tags always build (GitHub doesn't
# apply path filters to tags).
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'src/**'
      - 'game/**'
      - 'tools/build.ps1'
      - 'tools/build_shaders.ps1'
      - 'tools/package.py'
      - 'tools/changelog.py'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'game/**'
      - 'tools/build.ps1'
      - 'tools/build_shaders.ps1'
      - 'tools/package.py'
      - 'tools/changelog.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  windows:
    name: Windows ${{ matrix.configuration }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Build
        shell: pwsh
        run: tools/build.ps1 -Configuration ${{ matrix.configuration }}

      - name: Upload binaries and shaders
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.configuration }}
          path: |
            game/hidden2013/bin/x64/*.dll
            game/hidden2013/bin/x64/*.pdb
            game/hidden2013/shaders/fxc/*.vcs
            game/srcds_win64.exe
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.configuration }}
    runs-on: ubuntu-24.04
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [release, debug]

    steps:
      - uses: actions/checkout@v6

      - name: Build
        env:
          HIDDEN_IN_SNIPER: '1'
        run: src/buildhidden ${{ matrix.configuration }}

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.configuration }}
          path: |
            game/hidden2013/bin/linux64/*.so
            game/srcds_linux64
          if-no-files-found: error

  package:
    name: Package
    needs: [windows, linux]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      # The artifacts keep their paths below game/ (the common root of each upload).
      - uses: actions/download-artifact@v7
        with:
          name: windows-Release
          path: game

      - uses: actions/download-artifact@v7
        with:
          name: linux-release
          path: game

      # A release tag must name the version the build carries.
      - name: Check the tag against steam.inf
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          patch="$(sed -n 's/^PatchVersion=//p' game/hidden2013/steam.inf | tr -d '\r')"
          if [ "v$patch" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match steam.inf's PatchVersion $patch"
            exit 1
          fi

      - name: Package
        run: |
          version="$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
          chmod +x game/srcds_linux64
          for platform in windows linux windows-server linux-server; do
            python3 tools/package.py "$platform" --version "$version"
          done

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/*
          if-no-files-found: error

  latest:
    name: Update the latest prerelease
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: packages
          path: dist

      - name: Replace the latest prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Latest main build" --notes "Built from $GITHUB_SHA. Needs Hidden: Source Beta 4b installed; see the README." \
            --repo "$GITHUB_REPOSITORY"

  release:
    name: Release the tag
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # The whole history and tags, for the changelog since the previous tag.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: packages
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/changelog.py "$GITHUB_REF_NAME" > notes.md
          printf '\nNeeds Hidden: Source Beta 4b installed; see the README.\n' >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --repo "$GITHUB_REPOSITORY"
